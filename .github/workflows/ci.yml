name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt + go vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go vet (e2e build tag)
        run: go vet -tags e2e ./...

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests with race detector
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out
          retention-days: 7

  phase2:
    name: Phase 2 (AI + Device)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Phase 2 unit & integration tests
        run: go test ./internal/service/ ./internal/worker/ ./internal/api/ ./internal/repository/ -race -count=1 -v -run 'AnalyzeTranscript|AudioProcessorAnalyze|BuildAnalysisResult|StripCodeFences|IdentityInList|FormatIdentities|ParseDueAt|RecognizeIdentity|GenerateBindCode|Bind|Heartbeat|IssueCommand|Unbind|ListDevices|RandomBindCode|Device'

  e2e:
    name: E2E (MySQL + Redis)
    runs-on: ubuntu-latest
    needs: test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pulse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_DSN: 'root:rootpass@tcp(127.0.0.1:3306)/pulse?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_DATABASE_DSN: 'root:rootpass@tcp(127.0.0.1:3306)/pulse?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_REDIS_URL: 'redis://127.0.0.1:6379'
      JWT_SECRET: ci-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run database migrations
        run: go run ./cmd/migrate

      - name: Run live E2E
        run: go test -tags e2e -run 'TestLiveE2E' ./test/ -v -count=1

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: pulse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
