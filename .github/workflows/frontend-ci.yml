name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit-build:
    name: Lint, Typecheck, Unit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit & integration tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-build:
    name: Docker Build & SPA Smoke
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg VITE_API_BASE_URL=/api/v1 -t pulse-frontend:ci .

      - name: Run container
        run: docker run -d --name pulse-fe-ci -p 8081:80 pulse-frontend:ci

      - name: Smoke test SPA fallback & API proxy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/ >/dev/null; then break; fi
            sleep 1
          done
          # 根路径返回 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/)" = "200"
          # 子路由直接访问/刷新不 404（SPA 回退到 index.html）
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/timeline)" = "200"
          # /api 已配置反向代理（CI 中后端未启动，返回 502 而非 404 即证明代理生效）
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health)" = "502"

      - name: Cleanup container
        if: always()
        run: docker rm -f pulse-fe-ci || true
