; Pulse 硬件固件 — PlatformIO 配置
;
; 硬件: ESP32-S3R8 (8MB octal PSRAM) + W25Q128JVPIQ (16MB quad flash)
; 核心: Arduino-ESP32 2.0.x (IDF 4.4.x) —— 锁定大版本，禁止跳到 core 3.x，
;       否则 legacy I2S PDM 驱动 (driver/i2s.h) 会被移除导致音频模块编译失败。
;
; 每个 mXX_* env 都是可独立烧写运行的模块测试，互不依赖。
;   pio run -e m1_pmu -t upload -t monitor

[platformio]
default_envs = app

; ───────────────────────── 公共配置 ─────────────────────────
[common]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; 16MB flash + 8MB octal PSRAM。qio_opi = flash 四线 / PSRAM 八线。
board_build.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    ; 板上无 USB-UART 桥，串口必须走 GPIO19/20 的原生 USB CDC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DPULSE_FW_VERSION=\"0.1.0\"
    -Iinclude
    -Isrc

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.5

; ───────────────────────── 应用主固件 ─────────────────────────
; 最终交付固件：全部模块 + FreeRTOS 任务编排。
[env:app]
extends = common
build_src_filter = +<*> -<tests/>
build_flags =
    ${common.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^8.4.0

; ───────────────────────── M0: 配置系统 ─────────────────────────
; 无需任何外设，纯串口验证：打印全部配置项 + 引脚冲突自检。
[env:m0_config]
extends = common
build_src_filter = +<config/> +<tests/m0_config/>

; ───────────────────────── M1: 电源管理 ─────────────────────────
; I2C 总线扫描 + AXP2101 只读诊断（不修改任何电源轨）。
[env:m1_pmu]
extends = common
build_src_filter = +<config/> +<hal/pmu/> +<tests/m1_pmu/>
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@^0.2.7

; ───────────────────────── M2: 显示屏 ─────────────────────────
; ST7789 彩条/边框/背光测试。用于实测确认 LCD_Y_OFFSET 与颜色顺序。
[env:m2_display]
extends = common
build_src_filter = +<config/> +<hal/display/> +<tests/m2_display/>

; ───────────────────────── M10: LVGL 界面 ─────────────────────────
; 模拟数据驱动界面，遍历全部状态场景 + 触摸交互验证。
[env:m10_ui]
extends = common
build_src_filter = +<config/> +<hal/display/> +<hal/touch/> +<ui/lv_port/> +<ui/screens/> +<ui/fonts/> +<tests/m10_ui/>
build_flags =
    ${common.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    ${common.lib_deps}
    lvgl/lvgl@^8.4.0

; ───────────────────────── M9: 电源管理 ─────────────────────────
; 三级功耗状态机 + 深睡唤醒源（PWR 键 / PMU IRQ）+ 低电告警。
[env:m9_power]
extends = common
build_src_filter = +<config/> +<hal/pmu/> +<power/> +<tests/m9_power/>
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@^0.2.7

; ───────────────────────── M8: 上传层 ─────────────────────────
; multipart 流式上传 + 断网暂停/重连补传 + 失败退避归档。
; 需先在电脑上启动 tools/fake_server.py 并配好 cloud.base_url。
[env:m8_upload]
extends = common
build_src_filter = +<config/> +<hal/storage/> +<hal/rtc/> +<net/wifi/> +<net/upload/> +<tests/m8_upload/>

; ───────────────────────── M7: WiFi 配网 ─────────────────────────
; 环境扫描 + 非阻塞连接状态机 + 指数退避 + AP 网页配网（凭据存 NVS）。
[env:m7_wifi]
extends = common
build_src_filter = +<config/> +<net/wifi/> +<tests/m7_wifi/>

; ───────────────────────── M6: RTC + 时间戳 ─────────────────────────
; BM8563 寄存器往返验证、BCD 进位边界、RFC3339 格式、SNTP 校时。
[env:m6_rtc]
extends = common
build_src_filter = +<config/> +<hal/rtc/> +<tests/m6_rtc/>

; ───────────────────────── M5: 音频采集 ─────────────────────────
; I2S PDM 通路自检 + 实时电平表 + VAD 阈值标定 + 落盘录音。
; 依赖 legacy I2S 驱动（driver/i2s.h），core 3.x 会编译失败。
[env:m5_audio]
extends = common
build_src_filter = +<config/> +<hal/storage/> +<audio/> +<tests/m5_audio/>

; ───────────────────────── M4: 存储 ─────────────────────────
; SD 挂载诊断 + 写入吞吐基准 + spool 队列生命周期 + WAV 头校验。
; 同时是 GPIO45/46 上拉问题的判定依据（挂不上会自动降级 PSRAM）。
[env:m4_storage]
extends = common
build_src_filter = +<config/> +<hal/storage/> +<tests/m4_storage/>

; ───────────────────────── M3: 触摸 + LVGL ─────────────────────────
; 阶段 A 裸触摸验证坐标方向，阶段 B LVGL 界面验证交互与帧率。
; LVGL 锁 8.4：与 Arduino core 2.0.x / IDF 4.4 是经过验证的搭配，
; 9.x 重写了 display/indev API，移植层需整体重写。
[env:m3_touch]
extends = common
build_src_filter = +<config/> +<hal/display/> +<hal/touch/> +<ui/lv_port/> +<tests/m3_touch/>
build_flags =
    ${common.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    ${common.lib_deps}
    lvgl/lvgl@^8.4.0
