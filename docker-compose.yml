services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pulse}
      MYSQL_USER: ${MYSQL_USER:-pulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pulsepass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    build:
      context: ./backend
    image: pulse-backend:local
    entrypoint: ["pulse-migrate"]
    environment: &backend-base
      DATABASE_DSN: "${DATABASE_DSN:-pulse:pulsepass@tcp(mysql:3306)/pulse?charset=utf8mb4&parseTime=True&loc=Local}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: pulse-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-base
      PORT: "8080"
      GIN_MODE: "${GIN_MODE:-release}"
      STEPFUN_API_KEY: "${STEPFUN_API_KEY:-}"
      STEPFUN_API_BASE: "${STEPFUN_API_BASE:-https://api.stepfun.com/v1}"
      STEPFUN_STT_MODEL: "${STEPFUN_STT_MODEL:-stepaudio-2.5-asr}"
      # 音频加密存储（AES-256-GCM）：32 字节密钥的 base64 编码；留空关闭加密（生产必须配置）。
      AUDIO_ENCRYPTION_KEY: "${AUDIO_ENCRYPTION_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "/api/v1"
    image: pulse-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
